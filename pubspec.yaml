name: mindly
description: "Local-first, BYOK second-brain application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_local_notifications: 22.2.0
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  path_provider: ^2.1.6
  record: ^7.1.1
  timezone: ^0.11.1
  whisper_ggml: ^2.6.0

dependency_overrides:
  # whisper_ggml still declares the older 2.x FFmpeg package. The maintained
  # 3.6.2 build adds current iOS simulator XCFrameworks, Linux support, and the
  # Windows symlink-safe native archive extraction used by this six-target app.
  ffmpeg_kit_flutter_new_min: 3.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  sqlite3: ^3.5.0

flutter:
  uses-material-design: true
