name: Phase 7 Formatter

on:
  push:
    branches:
      - agent/phase-7-tier-3-ai-insights

permissions:
  contents: write

concurrency:
  group: phase7-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format Phase 7 Dart sources
        run: dart format lib test
      - name: Commit formatter output when needed
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Format final Phase 7 fixes"
          git push
