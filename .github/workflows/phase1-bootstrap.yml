name: Phase 1 Bootstrap

on:
  push:
    branches:
      - agent/phase-1-local-data

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, 'Implement Phase 1 local data layer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write Phase 1 sources
        shell: bash
        run: |
          set -euo pipefail

          cat > pubspec.yaml <<'YAML'
          name: mindly
          description: "Local-first, BYOK second-brain application."
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: ^3.12.2

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            drift: ^2.34.3
            drift_flutter: ^0.3.1
            path_provider: ^2.1.6

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^6.0.0
            drift_dev: ^2.34.5
            build_runner: ^2.15.3

          flutter:
            uses-material-design: true
          YAML

          mkdir -p lib/core/database lib/features/memory/data lib/features/memory/domain test/core/database test/features/memory/data tool docs/architecture docs/testing

          cat > lib/core/database/mindly_database.dart <<'DART'
          import 'dart:typed_data';

          import 'package:drift/drift.dart';
          import 'package:drift_flutter/drift_flutter.dart';

          part 'mindly_database.g.dart';

          class Captures extends Table {
            TextColumn get id => text()();
            TextColumn get mode => text()();
            TextColumn get context => text()();
            TextColumn get rawText => text().nullable()();
            TextColumn get transcript => text().nullable()();
            TextColumn get summary => text().nullable()();
            TextColumn get audioPath => text().nullable()();
            BoolColumn get isIncomplete => boolean().withDefault(const Constant(false))();
            BoolColumn get isPinned => boolean().withDefault(const Constant(false))();
            DateTimeColumn get createdAt => dateTime()();
            DateTimeColumn get updatedAt => dateTime()();

            @override
            Set<Column<Object>> get primaryKey => {id};
          }

          class People extends Table {
            TextColumn get id => text()();
            TextColumn get displayName => text()();
            TextColumn get normalizedName => text()();
            DateTimeColumn get createdAt => dateTime()();

            @override
            Set<Column<Object>> get primaryKey => {id};
          }

          class Topics extends Table {
            TextColumn get id => text()();
            TextColumn get label => text()();
            TextColumn get normalizedLabel => text()();
            DateTimeColumn get createdAt => dateTime()();

            @override
            Set<Column<Object>> get primaryKey => {id};
          }

          class Commitments extends Table {
            TextColumn get id => text()();
            TextColumn get captureId => text().nullable().references(Captures, #id, onDelete: KeyAction.cascade)();
            TextColumn get text => text()();
            DateTimeColumn get dueDate => dateTime().nullable()();
            TextColumn get owner => text().nullable()();
            TextColumn get status => text().withDefault(const Constant('open'))();
            DateTimeColumn get createdAt => dateTime()();

            @override
            Set<Column<Object>> get primaryKey => {id};
          }

          class MemoryRelationships extends Table {
            TextColumn get id => text()();
            TextColumn get fromType => text()();
            TextColumn get fromId => text()();
            TextColumn get relationType => text()();
            TextColumn get toType => text()();
            TextColumn get toId => text()();
            DateTimeColumn get createdAt => dateTime()();

            @override
            Set<Column<Object>> get primaryKey => {id};
          }

          class MemoryEmbeddings extends Table {
            TextColumn get id => text()();
            TextColumn get ownerType => text()();
            TextColumn get ownerId => text()();
            TextColumn get model => text()();
            IntColumn get dimensions => integer()();
            BlobColumn get vector => blob()();
            DateTimeColumn get createdAt => dateTime()();

            @override
            Set<Column<Object>> get primaryKey => {id};

            @override
            List<Set<Column<Object>>> get uniqueKeys => [
                  {ownerType, ownerId, model},
                ];
          }

          @DriftDatabase(
            tables: [
              Captures,
              People,
              Topics,
              Commitments,
              MemoryRelationships,
              MemoryEmbeddings,
            ],
          )
          class MindlyDatabase extends _$MindlyDatabase {
            MindlyDatabase(super.executor);

            MindlyDatabase.defaults()
                : super(
                    driftDatabase(
                      name: 'mindly',
                      native: const DriftNativeOptions(shareAcrossIsolates: true),
                      web: DriftWebOptions(
                        sqlite3Wasm: Uri.parse('sqlite3.wasm'),
                        driftWorker: Uri.parse('drift_worker.js'),
                      ),
                    ),
                  );

            @override
            int get schemaVersion => 2;

            @override
            MigrationStrategy get migration => MigrationStrategy(
                  onCreate: (m) async {
                    await m.createAll();
                    await _createSearchIndex();
                  },
                  onUpgrade: (m, from, to) async {
                    if (from < 2) {
                      await m.addColumn(captures, captures.isPinned);
                    }
                    await _createSearchIndex();
                  },
                  beforeOpen: (details) async {
                    await customStatement('PRAGMA foreign_keys = ON');
                  },
                );

            Future<void> _createSearchIndex() async {
              await customStatement('''
                CREATE VIRTUAL TABLE IF NOT EXISTS memory_fts USING fts5(
                  entity_type UNINDEXED,
                  entity_id UNINDEXED,
                  content,
                  tokenize = 'unicode61'
                )
              ''');
            }

            Future<int> countRows(String tableName) async {
              final result = await customSelect(
                'SELECT COUNT(*) AS total FROM $tableName',
                readsFrom: allTables,
              ).getSingle();
              return result.read<int>('total');
            }
          }

          extension BlobCopy on Uint8List {
            Uint8List copied() => Uint8List.fromList(this);
          }
          DART

          cat > lib/features/memory/domain/memory_models.dart <<'DART'
          class MemorySearchHit {
            const MemorySearchHit({
              required this.entityType,
              required this.entityId,
              required this.content,
              required this.rank,
            });

            final String entityType;
            final String entityId;
            final String content;
            final double rank;
          }

          class VectorSearchHit {
            const VectorSearchHit({
              required this.ownerType,
              required this.ownerId,
              required this.score,
            });

            final String ownerType;
            final String ownerId;
            final double score;
          }
          DART

          cat > lib/features/memory/data/float32_vector_codec.dart <<'DART'
          import 'dart:typed_data';

          abstract final class Float32VectorCodec {
            static Uint8List encode(List<double> values) {
              if (values.isEmpty) {
                throw ArgumentError.value(values, 'values', 'Vector must not be empty.');
              }
              if (values.any((value) => !value.isFinite)) {
                throw ArgumentError.value(values, 'values', 'Vector values must be finite.');
              }

              final bytes = ByteData(values.length * Float32List.bytesPerElement);
              for (var index = 0; index < values.length; index++) {
                bytes.setFloat32(
                  index * Float32List.bytesPerElement,
                  values[index],
                  Endian.little,
                );
              }
              return bytes.buffer.asUint8List();
            }

            static List<double> decode(Uint8List bytes) {
              if (bytes.isEmpty || bytes.lengthInBytes % Float32List.bytesPerElement != 0) {
                throw ArgumentError.value(bytes.lengthInBytes, 'bytes', 'Invalid Float32 vector byte length.');
              }

              final data = ByteData.sublistView(bytes);
              return List<double>.generate(
                bytes.lengthInBytes ~/ Float32List.bytesPerElement,
                (index) => data.getFloat32(
                  index * Float32List.bytesPerElement,
                  Endian.little,
                ),
                growable: false,
              );
            }
          }
          DART

          cat > lib/features/memory/data/vector_search_service.dart <<'DART'
          import 'dart:math' as math;

          import 'package:drift/drift.dart';
          import 'package:mindly/core/database/mindly_database.dart';
          import 'package:mindly/features/memory/data/float32_vector_codec.dart';
          import 'package:mindly/features/memory/domain/memory_models.dart';

          class VectorSearchService {
            VectorSearchService(this._database);

            final MindlyDatabase _database;

            Future<void> upsert({
              required String id,
              required String ownerType,
              required String ownerId,
              required String model,
              required List<double> vector,
            }) async {
              final encoded = Float32VectorCodec.encode(vector);
              await _database.into(_database.memoryEmbeddings).insertOnConflictUpdate(
                    MemoryEmbeddingsCompanion.insert(
                      id: id,
                      ownerType: ownerType,
                      ownerId: ownerId,
                      model: model,
                      dimensions: vector.length,
                      vector: encoded,
                      createdAt: DateTime.now().toUtc(),
                    ),
                  );
            }

            Future<List<VectorSearchHit>> search({
              required String model,
              required List<double> query,
              String? ownerType,
              int limit = 10,
            }) async {
              if (limit <= 0) {
                return const [];
              }
              Float32VectorCodec.encode(query);

              final select = _database.select(_database.memoryEmbeddings)
                ..where((row) => row.model.equals(model) & row.dimensions.equals(query.length));
              if (ownerType != null) {
                select.where((row) => row.ownerType.equals(ownerType));
              }

              final rows = await select.get();
              final hits = rows
                  .map(
                    (row) => VectorSearchHit(
                      ownerType: row.ownerType,
                      ownerId: row.ownerId,
                      score: cosineSimilarity(query, Float32VectorCodec.decode(row.vector)),
                    ),
                  )
                  .toList(growable: false)
                ..sort((left, right) => right.score.compareTo(left.score));

              return hits.take(math.min(limit, hits.length)).toList(growable: false);
            }

            static double cosineSimilarity(List<double> left, List<double> right) {
              if (left.length != right.length || left.isEmpty) {
                throw ArgumentError('Vectors must be non-empty and have identical dimensions.');
              }

              var dot = 0.0;
              var leftNorm = 0.0;
              var rightNorm = 0.0;
              for (var index = 0; index < left.length; index++) {
                dot += left[index] * right[index];
                leftNorm += left[index] * left[index];
                rightNorm += right[index] * right[index];
              }

              if (leftNorm == 0 || rightNorm == 0) {
                return 0;
              }
              return dot / (math.sqrt(leftNorm) * math.sqrt(rightNorm));
            }
          }
          DART

          cat > lib/features/memory/data/memory_repository.dart <<'DART'
          import 'package:drift/drift.dart';
          import 'package:mindly/core/database/mindly_database.dart';
          import 'package:mindly/features/memory/domain/memory_models.dart';

          class MemoryRepository {
            MemoryRepository(this._database);

            final MindlyDatabase _database;

            Future<void> saveCapture({
              required String id,
              required String mode,
              required String context,
              String? rawText,
              String? transcript,
              String? summary,
              String? audioPath,
              bool isIncomplete = false,
              bool isPinned = false,
              DateTime? createdAt,
            }) async {
              final now = DateTime.now().toUtc();
              await _database.transaction(() async {
                await _database.into(_database.captures).insertOnConflictUpdate(
                      CapturesCompanion.insert(
                        id: id,
                        mode: mode,
                        context: context,
                        rawText: Value(rawText),
                        transcript: Value(transcript),
                        summary: Value(summary),
                        audioPath: Value(audioPath),
                        isIncomplete: Value(isIncomplete),
                        isPinned: Value(isPinned),
                        createdAt: createdAt ?? now,
                        updatedAt: now,
                      ),
                    );
                await _replaceSearchDocument(
                  entityType: 'capture',
                  entityId: id,
                  content: [summary, transcript, rawText].whereType<String>().where((value) => value.trim().isNotEmpty).join(' '),
                );
              });
            }

            Future<void> savePerson({required String id, required String displayName}) async {
              final value = displayName.trim();
              await _database.transaction(() async {
                await _database.into(_database.people).insertOnConflictUpdate(
                      PeopleCompanion.insert(
                        id: id,
                        displayName: value,
                        normalizedName: value.toLowerCase(),
                        createdAt: DateTime.now().toUtc(),
                      ),
                    );
                await _replaceSearchDocument(entityType: 'person', entityId: id, content: value);
              });
            }

            Future<void> saveTopic({required String id, required String label}) async {
              final value = label.trim();
              await _database.transaction(() async {
                await _database.into(_database.topics).insertOnConflictUpdate(
                      TopicsCompanion.insert(
                        id: id,
                        label: value,
                        normalizedLabel: value.toLowerCase(),
                        createdAt: DateTime.now().toUtc(),
                      ),
                    );
                await _replaceSearchDocument(entityType: 'topic', entityId: id, content: value);
              });
            }

            Future<void> saveCommitment({
              required String id,
              required String text,
              String? captureId,
              DateTime? dueDate,
              String? owner,
              String status = 'open',
            }) async {
              await _database.transaction(() async {
                await _database.into(_database.commitments).insertOnConflictUpdate(
                      CommitmentsCompanion.insert(
                        id: id,
                        captureId: Value(captureId),
                        text: text,
                        dueDate: Value(dueDate),
                        owner: Value(owner),
                        status: Value(status),
                        createdAt: DateTime.now().toUtc(),
                      ),
                    );
                await _replaceSearchDocument(entityType: 'commitment', entityId: id, content: text);
              });
            }

            Future<void> link({
              required String id,
              required String fromType,
              required String fromId,
              required String relationType,
              required String toType,
              required String toId,
            }) {
              return _database.into(_database.memoryRelationships).insertOnConflictUpdate(
                    MemoryRelationshipsCompanion.insert(
                      id: id,
                      fromType: fromType,
                      fromId: fromId,
                      relationType: relationType,
                      toType: toType,
                      toId: toId,
                      createdAt: DateTime.now().toUtc(),
                    ),
                  );
            }

            Future<List<MemorySearchHit>> keywordSearch(String query, {int limit = 20}) async {
              final expression = _ftsExpression(query);
              if (expression == null || limit <= 0) {
                return const [];
              }

              final rows = await _database.customSelect(
                '''
                SELECT entity_type, entity_id, content, bm25(memory_fts) AS rank
                FROM memory_fts
                WHERE memory_fts MATCH ?
                ORDER BY rank
                LIMIT ?
                ''',
                variables: [Variable<String>(expression), Variable<int>(limit)],
              ).get();

              return rows
                  .map(
                    (row) => MemorySearchHit(
                      entityType: row.read<String>('entity_type'),
                      entityId: row.read<String>('entity_id'),
                      content: row.read<String>('content'),
                      rank: row.read<double>('rank'),
                    ),
                  )
                  .toList(growable: false);
            }

            Future<void> deleteMemory({required String entityType, required String entityId}) async {
              await _database.transaction(() async {
                await (_database.delete(_database.memoryRelationships)
                      ..where((row) =>
                          (row.fromType.equals(entityType) & row.fromId.equals(entityId)) |
                          (row.toType.equals(entityType) & row.toId.equals(entityId))))
                    .go();
                await (_database.delete(_database.memoryEmbeddings)
                      ..where((row) => row.ownerType.equals(entityType) & row.ownerId.equals(entityId)))
                    .go();
                await _database.customStatement(
                  'DELETE FROM memory_fts WHERE entity_type = ? AND entity_id = ?',
                  [entityType, entityId],
                );

                switch (entityType) {
                  case 'capture':
                    await (_database.delete(_database.captures)..where((row) => row.id.equals(entityId))).go();
                  case 'person':
                    await (_database.delete(_database.people)..where((row) => row.id.equals(entityId))).go();
                  case 'topic':
                    await (_database.delete(_database.topics)..where((row) => row.id.equals(entityId))).go();
                  case 'commitment':
                    await (_database.delete(_database.commitments)..where((row) => row.id.equals(entityId))).go();
                  default:
                    throw ArgumentError.value(entityType, 'entityType', 'Unsupported memory entity type.');
                }
              });
            }

            Future<void> wipeAll() async {
              await _database.transaction(() async {
                await _database.delete(_database.memoryRelationships).go();
                await _database.delete(_database.memoryEmbeddings).go();
                await _database.delete(_database.commitments).go();
                await _database.delete(_database.people).go();
                await _database.delete(_database.topics).go();
                await _database.delete(_database.captures).go();
                await _database.customStatement('DELETE FROM memory_fts');
              });
            }

            Future<void> _replaceSearchDocument({
              required String entityType,
              required String entityId,
              required String content,
            }) async {
              await _database.customStatement(
                'DELETE FROM memory_fts WHERE entity_type = ? AND entity_id = ?',
                [entityType, entityId],
              );
              if (content.trim().isNotEmpty) {
                await _database.customStatement(
                  'INSERT INTO memory_fts(entity_type, entity_id, content) VALUES (?, ?, ?)',
                  [entityType, entityId, content.trim()],
                );
              }
            }

            String? _ftsExpression(String query) {
              final tokens = query
                  .trim()
                  .split(RegExp(r'\s+'))
                  .map((token) => token.trim())
                  .where((token) => token.isNotEmpty)
                  .map((token) => '"${token.replaceAll('"', '""')}"')
                  .toList(growable: false);
              return tokens.isEmpty ? null : tokens.join(' AND ');
            }
          }
          DART

          cat > test/core/database/mindly_database_test.dart <<'DART'
          import 'dart:io';

          import 'package:drift/native.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:mindly/core/database/mindly_database.dart';
          import 'package:sqlite3/sqlite3.dart' as sqlite;

          void main() {
            test('fresh database creates version 2 schema and FTS table', () async {
              final database = MindlyDatabase(NativeDatabase.memory());
              addTearDown(database.close);

              expect(database.schemaVersion, 2);
              final fts = await database.customSelect(
                "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'memory_fts'",
              ).getSingleOrNull();
              expect(fts, isNotNull);
            });

            test('migrates v1 capture table by adding is_pinned', () async {
              final directory = await Directory.systemTemp.createTemp('mindly-migration-');
              addTearDown(() => directory.delete(recursive: true));
              final file = File('${directory.path}/migration.sqlite');

              final raw = sqlite.sqlite3.open(file.path);
              raw.execute('''
                CREATE TABLE captures (
                  id TEXT NOT NULL PRIMARY KEY,
                  mode TEXT NOT NULL,
                  context TEXT NOT NULL,
                  raw_text TEXT,
                  transcript TEXT,
                  summary TEXT,
                  audio_path TEXT,
                  is_incomplete INTEGER NOT NULL DEFAULT 0 CHECK (is_incomplete IN (0, 1)),
                  created_at INTEGER NOT NULL,
                  updated_at INTEGER NOT NULL
                )
              ''');
              raw.execute('PRAGMA user_version = 1');
              raw.dispose();

              final database = MindlyDatabase(NativeDatabase(file));
              addTearDown(database.close);
              final columns = await database.customSelect('PRAGMA table_info(captures)').get();
              expect(columns.map((row) => row.read<String>('name')), contains('is_pinned'));
            });
          }
          DART

          cat > test/features/memory/data/float32_vector_codec_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:mindly/features/memory/data/float32_vector_codec.dart';

          void main() {
            test('Float32 vectors round-trip with expected precision', () {
              final decoded = Float32VectorCodec.decode(
                Float32VectorCodec.encode([1.25, -2.5, 3.125]),
              );
              expect(decoded[0], closeTo(1.25, 0.00001));
              expect(decoded[1], closeTo(-2.5, 0.00001));
              expect(decoded[2], closeTo(3.125, 0.00001));
            });

            test('rejects empty and non-finite vectors', () {
              expect(() => Float32VectorCodec.encode([]), throwsArgumentError);
              expect(() => Float32VectorCodec.encode([double.nan]), throwsArgumentError);
            });
          }
          DART

          cat > test/features/memory/data/memory_repository_test.dart <<'DART'
          import 'package:drift/native.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:mindly/core/database/mindly_database.dart';
          import 'package:mindly/features/memory/data/memory_repository.dart';
          import 'package:mindly/features/memory/data/vector_search_service.dart';

          void main() {
            late MindlyDatabase database;
            late MemoryRepository repository;
            late VectorSearchService vectors;

            setUp(() {
              database = MindlyDatabase(NativeDatabase.memory());
              repository = MemoryRepository(database);
              vectors = VectorSearchService(database);
            });

            tearDown(() => database.close());

            test('capture, entities, commitments and relationships round-trip', () async {
              await repository.saveCapture(
                id: 'c1',
                mode: 'text_first',
                context: 'work',
                rawText: 'Discuss launch plan with Maya',
                summary: 'Launch planning',
              );
              await repository.savePerson(id: 'p1', displayName: 'Maya');
              await repository.saveTopic(id: 't1', label: 'Launch Plan');
              await repository.saveCommitment(id: 'k1', captureId: 'c1', text: 'Send launch draft');
              await repository.link(
                id: 'r1',
                fromType: 'person',
                fromId: 'p1',
                relationType: 'mentioned_in',
                toType: 'capture',
                toId: 'c1',
              );

              expect(await database.select(database.captures).get(), hasLength(1));
              expect(await database.select(database.people).get(), hasLength(1));
              expect(await database.select(database.topics).get(), hasLength(1));
              expect(await database.select(database.commitments).get(), hasLength(1));
              expect(await database.select(database.memoryRelationships).get(), hasLength(1));
            });

            test('FTS reflects inserts, updates and deletes', () async {
              await repository.saveCapture(
                id: 'c1',
                mode: 'text_first',
                context: 'personal',
                summary: 'Plan a Jaipur trip',
              );
              expect((await repository.keywordSearch('Jaipur')).single.entityId, 'c1');

              await repository.saveCapture(
                id: 'c1',
                mode: 'text_first',
                context: 'personal',
                summary: 'Plan a Pune trip',
              );
              expect(await repository.keywordSearch('Jaipur'), isEmpty);
              expect((await repository.keywordSearch('Pune')).single.entityId, 'c1');

              await repository.deleteMemory(entityType: 'capture', entityId: 'c1');
              expect(await repository.keywordSearch('Pune'), isEmpty);
            });

            test('vector search ranks closest vectors and isolates model/dimension', () async {
              await vectors.upsert(
                id: 'e1',
                ownerType: 'capture',
                ownerId: 'c1',
                model: 'model-a',
                vector: [1, 0, 0],
              );
              await vectors.upsert(
                id: 'e2',
                ownerType: 'capture',
                ownerId: 'c2',
                model: 'model-a',
                vector: [0.8, 0.2, 0],
              );
              await vectors.upsert(
                id: 'e3',
                ownerType: 'capture',
                ownerId: 'c3',
                model: 'model-b',
                vector: [1, 0, 0],
              );
              await vectors.upsert(
                id: 'e4',
                ownerType: 'capture',
                ownerId: 'c4',
                model: 'model-a',
                vector: [1, 0],
              );

              final hits = await vectors.search(model: 'model-a', query: [1, 0, 0]);
              expect(hits.map((hit) => hit.ownerId), ['c1', 'c2']);
            });

            test('full wipe removes structured, FTS and vector data', () async {
              await repository.saveCapture(
                id: 'c1',
                mode: 'text_first',
                context: 'work',
                summary: 'Quarterly planning',
              );
              await vectors.upsert(
                id: 'e1',
                ownerType: 'capture',
                ownerId: 'c1',
                model: 'model-a',
                vector: [1, 0],
              );

              await repository.wipeAll();

              expect(await database.select(database.captures).get(), isEmpty);
              expect(await database.select(database.memoryEmbeddings).get(), isEmpty);
              expect(await repository.keywordSearch('Quarterly'), isEmpty);
            });
          }
          DART

          cat > test/core/database/web_assets_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('Drift web runtime assets are present and non-trivial', () {
              final wasm = File('web/sqlite3.wasm');
              final worker = File('web/drift_worker.js');
              expect(wasm.existsSync(), isTrue);
              expect(worker.existsSync(), isTrue);
              expect(wasm.lengthSync(), greaterThan(500000));
              expect(worker.lengthSync(), greaterThan(300000));
            });
          }
          DART

          cat > tool/vector_benchmark.dart <<'DART'
          import 'dart:math';

          import 'package:mindly/features/memory/data/vector_search_service.dart';

          void main() {
            const count = 10000;
            const dimensions = 64;
            final random = Random(42);
            final query = List<double>.generate(dimensions, (_) => random.nextDouble(), growable: false);
            final corpus = List<List<double>>.generate(
              count,
              (_) => List<double>.generate(dimensions, (_) => random.nextDouble(), growable: false),
              growable: false,
            );

            final watch = Stopwatch()..start();
            var best = -2.0;
            for (final vector in corpus) {
              final score = VectorSearchService.cosineSimilarity(query, vector);
              if (score > best) {
                best = score;
              }
            }
            watch.stop();

            if (!best.isFinite) {
              throw StateError('Vector benchmark produced an invalid result.');
            }
            print('Mindly vector characterization: $count x $dimensions in ${watch.elapsedMilliseconds} ms; best=$best');
          }
          DART

          cat > docs/architecture/local-data-layer.md <<'MD'
          # Local data layer

          Phase 1 uses Drift 2.34.x as the single logical relational schema across all six targets. Native Flutter targets use SQLite through `drift_flutter`; Web uses Drift's WebAssembly runtime with `sqlite3.wasm` and `drift_worker.js` from the matching Drift release.

          ## Memory graph

          Captures, people, topics, commitments, generic relationships, and embeddings are persisted locally. FTS5 provides keyword search. Embeddings are stored as little-endian Float32 blobs with model and dimension metadata.

          ## Portable vector search

          Phase 1 deliberately uses a portable exact cosine scan over locally stored embeddings instead of a native-only SQLite vector extension. This keeps identical semantics on Web and native targets. The storage/service boundary allows a native ANN or SQLite vector accelerator to be added later without changing memory-domain callers.

          This exact scan is correct but O(n × dimensions). The 10,000-vector CI benchmark is characterization only and is not evidence that NFR-4.2.2 is met on a mid-tier device. Native performance must be measured on representative hardware before release; Web receives a separately documented practical ceiling.

          ## Web persistence

          `drift_flutter` automatically selects the best browser storage implementation available (OPFS where possible, otherwise IndexedDB-backed options). The app ships the matching Drift 2.34.3 WebAssembly and worker assets. Browser persistence must still be manually verified on the supported Chrome, Edge, Safari, and Firefox matrix because build CI cannot substitute for each browser's storage capability.
          MD

          cat > docs/testing/phase-1-manual-web-persistence.md <<'MD'
          # Phase 1 manual Web persistence smoke test

          1. Run `flutter run -d chrome` and ensure `sqlite3.wasm` is served as `application/wasm`.
          2. Create a capture through a temporary debug harness or repository call and note its id.
          3. Reload the page. Confirm the capture is still present.
          4. Close and reopen the browser tab. Confirm the capture is still present.
          5. Repeat in current Chrome, Edge, Firefox, and Safari.
          6. Clear site data and confirm the record is gone.
          7. Record the storage implementation reported by Drift and any missing browser features.

          A browser falling back to non-persistent in-memory storage is a Phase 1 blocker for that browser and must not be silently accepted.
          MD

          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches:
                - main
                - develop
                - 'agent/**'
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          env:
            FLUTTER_VERSION: '3.44.8'

          jobs:
            quality:
              name: Analyze, test and characterize
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: ${{ env.FLUTTER_VERSION }}
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: dart run build_runner build --delete-conflicting-outputs
                - name: Verify generated Drift code is current
                  run: git diff --exit-code
                - run: dart format --output=none --set-exit-if-changed lib test tool
                - run: flutter analyze
                - run: flutter test
                - run: dart run tool/vector_benchmark.dart

            android:
              name: Build Android
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: ${{ env.FLUTTER_VERSION }}
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: flutter build apk --debug

            web:
              name: Build Web
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: ${{ env.FLUTTER_VERSION }}
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: flutter build web

            linux:
              name: Build Linux
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - name: Install Linux desktop dependencies
                  run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: ${{ env.FLUTTER_VERSION }}
                    channel: stable
                    cache: true
                - run: flutter config --enable-linux-desktop
                - run: flutter pub get
                - run: flutter build linux --debug

            windows:
              name: Build Windows
              runs-on: windows-latest
              steps:
                - uses: actions/checkout@v7
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: ${{ env.FLUTTER_VERSION }}
                    channel: stable
                    cache: true
                - run: flutter config --enable-windows-desktop
                - run: flutter pub get
                - run: flutter build windows --debug

            macos:
              name: Build macOS
              runs-on: macos-latest
              steps:
                - uses: actions/checkout@v7
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: ${{ env.FLUTTER_VERSION }}
                    channel: stable
                    cache: true
                - run: flutter config --enable-macos-desktop
                - run: flutter pub get
                - run: flutter build macos --debug

            ios:
              name: Build iOS simulator
              runs-on: macos-latest
              steps:
                - uses: actions/checkout@v7
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: ${{ env.FLUTTER_VERSION }}
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: flutter build ios --simulator --debug
          YAML

      - name: Resolve dependencies and generate Drift code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test tool

      - name: Add matching Drift web runtime assets
        run: |
          curl -fL --retry 3 -o web/sqlite3.wasm https://github.com/simolus3/drift/releases/download/drift-2.34.3/sqlite3.wasm
          curl -fL --retry 3 -o web/drift_worker.js https://github.com/simolus3/drift/releases/download/drift-2.34.3/drift_worker.js
          test $(stat -c%s web/sqlite3.wasm) -gt 500000
          test $(stat -c%s web/drift_worker.js) -gt 300000

      - name: Validate Phase 1 before commit
        run: |
          flutter analyze
          flutter test
          dart run tool/vector_benchmark.dart
          flutter build web
          flutter build apk --debug

      - name: Commit validated Phase 1 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock lib test tool docs web/sqlite3.wasm web/drift_worker.js .github/workflows/ci.yml
          git commit -m "Implement Phase 1 local data layer"
          git push
