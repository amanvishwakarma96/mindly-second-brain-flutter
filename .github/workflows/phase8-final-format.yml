name: Phase 8 Final Format

on:
  push:
    branches:
      - agent/phase-8-notifications

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: dart format lib/features/notifications/application/notification_controller.dart test/features/notifications/notification_controller_test.dart
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/notifications/application/notification_controller.dart test/features/notifications/notification_controller_test.dart
          if git diff --cached --quiet; then
            echo "No format changes needed."
            exit 0
          fi
          git commit -m "Format final Phase 8 notification changes"
          git push
