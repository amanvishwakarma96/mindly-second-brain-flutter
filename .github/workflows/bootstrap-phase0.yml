          cat > test/app/platform/screen_family_test.dart <<'DART'
          import 'package:flutter/foundation.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:mindly/app/platform/screen_family.dart';

          void main() {
            group('resolveScreenFamily', () {
              test('web override always selects web', () {
                expect(
                  resolveScreenFamily(
                    isWebOverride: true,
                    platformOverride: TargetPlatform.android,
                  ),
                  ScreenFamily.web,
                );
              });

              test('Android and iOS select mobile screens', () {
                for (final platform in [TargetPlatform.android, TargetPlatform.iOS]) {
                  expect(
                    resolveScreenFamily(
                      isWebOverride: false,
                      platformOverride: platform,
                    ),
                    ScreenFamily.mobile,
                  );
                }
              });

              test('Windows, macOS and Linux select desktop screens', () {
                for (final platform in [
                  TargetPlatform.windows,
                  TargetPlatform.macOS,
                  TargetPlatform.linux,
                ]) {
                  expect(
                    resolveScreenFamily(
                      isWebOverride: false,
                      platformOverride: platform,
                    ),
                    ScreenFamily.desktop,
                  );
                }
              });
            });
          }
          DART

          cat > test/app/mindly_app_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:mindly/app/mindly_app.dart';
          import 'package:mindly/app/platform/screen_family.dart';
          import 'package:mindly/screens/desktop/home/desktop_home_screen.dart';
          import 'package:mindly/screens/mobile/home/mobile_home_screen.dart';
          import 'package:mindly/screens/web/home/web_home_screen.dart';

          void main() {
            for (final testCase in <(ScreenFamily, Key, Key, Key)>[
              (
                ScreenFamily.mobile,
                MobileHomeScreen.screenKey,
                DesktopHomeScreen.screenKey,
                WebHomeScreen.screenKey,
              ),
              (
                ScreenFamily.desktop,
                DesktopHomeScreen.screenKey,
                MobileHomeScreen.screenKey,
                WebHomeScreen.screenKey,
              ),
              (
                ScreenFamily.web,
                WebHomeScreen.screenKey,
                MobileHomeScreen.screenKey,
                DesktopHomeScreen.screenKey,
              ),
            ]) {
              testWidgets('${testCase.$1.name} loads only its own home screen', (tester) async {
                await tester.pumpWidget(MindlyApp(screenFamilyOverride: testCase.$1));

                expect(find.byKey(testCase.$2), findsOneWidget);
                expect(find.byKey(testCase.$3), findsNothing);
                expect(find.byKey(testCase.$4), findsNothing);
              });
            }
          }
          DART

          cat > test/architecture/platform_screen_boundary_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('platform screen folders never import sibling screen folders', () {
              final platformFolders = ['mobile', 'desktop', 'web'];

              for (final platform in platformFolders) {
                final directory = Directory('lib/screens/$platform');
                final forbidden = platformFolders.where((value) => value != platform);

                for (final entity in directory.listSync(recursive: true)) {
                  if (entity is! File || !entity.path.endsWith('.dart')) {
                    continue;
                  }

                  final source = entity.readAsStringSync();
                  for (final sibling in forbidden) {
                    expect(
                      source.contains('package:mindly/screens/$sibling/'),
                      isFalse,
                      reason: '${entity.path} imports the $sibling screen layer.',
                    );
                  }
                }
              }
            });

            test('shared layers never import platform screens', () {
              for (final root in ['lib/core', 'lib/features', 'lib/shared']) {
                final directory = Directory(root);
                for (final entity in directory.listSync(recursive: true)) {
                  if (entity is! File || !entity.path.endsWith('.dart')) {
                    continue;
                  }

                  final source = entity.readAsStringSync();
                  expect(
                    source.contains('package:mindly/screens/'),
                    isFalse,
                    reason: '${entity.path} leaks a screen dependency into a shared layer.',
                  );
                }
              }
            });
          }
          DART

          cat > docs/architecture/platform-screen-boundary.md <<'MD'
          # Platform screen boundary

          Mindly deliberately keeps complete screen implementations separate by platform class:

          - `lib/screens/mobile/`
          - `lib/screens/desktop/`
          - `lib/screens/web/`

          Shared business logic belongs in `lib/core/` and `lib/features/`. Shared visual language belongs in `lib/shared/design_tokens/` and small reusable widgets in `lib/shared/widgets/`.

          `lib/app/platform/platform_screen_router.dart` is the single allowed composition boundary that imports all three screen families and selects one complete screen implementation at runtime.

          ## Enforcement

          1. A platform screen folder must never import another platform screen folder.
          2. `core`, `features`, and `shared` must never import `screens`.
          3. Cross-platform behavior is changed in a shared layer, not copied into screens.
          4. Platform-specific layout changes stay inside that platform's screen folder.
          5. `test/architecture/platform_screen_boundary_test.dart` fails when rules 1 or 2 are violated.

          These constraints are intentional even when sharing a conditional layout would use fewer files.
          MD

          cat > README.md <<'MD'
          # Mindly

          Mindly is a local-first, BYOK second-brain application built with Flutter for iOS, Android, Windows, macOS, Linux, and Web.

          ## Phase 0 architecture

          ```text
          lib/
          ├── app/                      # app composition + platform screen routing
          ├── core/                     # shared non-UI logic
          ├── features/                 # shared feature/application logic
          ├── shared/
          │   ├── design_tokens/        # colors, spacing, theme
          │   └── widgets/              # intentionally small shared components
          └── screens/
              ├── mobile/               # independent mobile screens
              ├── desktop/              # independent desktop screens
              └── web/                  # independent web screens
          ```

          The platform screen folders are isolated by architecture tests. The app routing layer selects the complete mobile, desktop, or web screen implementation at runtime.

          ## Supported targets

          - Android
          - iOS
          - Windows
          - macOS
          - Linux
          - Web

          ## Development

          ```bash
          flutter pub get
          flutter analyze
          flutter test
          flutter run
          ```

          See `docs/architecture/platform-screen-boundary.md` before adding or moving UI code.
          MD

          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches:
                - main
                - develop
                - 'agent/**'
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          env:
            FLUTTER_VERSION: '3.44.8'

          jobs:
            quality:
              name: Analyze and test
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.44.8'
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: dart format --output=none --set-exit-if-changed lib test
                - run: flutter analyze
                - run: flutter test

            android:
              name: Build Android
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.44.8'
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: flutter build apk --debug

            web:
              name: Build Web
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.44.8'
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: flutter build web

            linux:
              name: Build Linux
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Install Linux desktop dependencies
                  run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.44.8'
                    channel: stable
                    cache: true
                - run: flutter config --enable-linux-desktop
                - run: flutter pub get
                - run: flutter build linux --debug

            windows:
              name: Build Windows
              runs-on: windows-latest
              steps:
                - uses: actions/checkout@v4
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.44.8'
                    channel: stable
                    cache: true
                - run: flutter config --enable-windows-desktop
                - run: flutter pub get
                - run: flutter build windows --debug

            macos:
              name: Build macOS
              runs-on: macos-latest
              steps:
                - uses: actions/checkout@v4
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.44.8'
                    channel: stable
                    cache: true
                - run: flutter config --enable-macos-desktop
                - run: flutter pub get
                - run: flutter build macos --debug

            ios:
              name: Build iOS simulator
              runs-on: macos-latest
              steps:
                - uses: actions/checkout@v4
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.44.8'
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: flutter build ios --simulator --debug
          YAML

          rm -f test/widget_test.dart
          dart format lib test

      - name: Validate Phase 0 before publishing scaffold
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build web
          flutter build apk --debug

      - name: Commit generated scaffold
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-phase0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bootstrap Flutter six-platform architecture'
          git push origin HEAD:agent/phase-0-scaffolding
