name: Phase 1 Web Assets

on:
  push:
    branches:
      - agent/phase-1-local-data

permissions:
  contents: write

jobs:
  provision:
    if: github.event.head_commit.message != 'Add Phase 1 Drift web runtime assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download matching Drift web assets
        run: |
          curl -fL --retry 3 -o web/sqlite3.wasm https://github.com/simolus3/drift/releases/download/drift-2.34.3/sqlite3.wasm
          curl -fL --retry 3 -o web/drift_worker.js https://github.com/simolus3/drift/releases/download/drift-2.34.3/drift_worker.js
          test $(stat -c%s web/sqlite3.wasm) -gt 500000
          test $(stat -c%s web/drift_worker.js) -gt 300000
      - name: Commit Drift web runtime assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/sqlite3.wasm web/drift_worker.js
          git commit -m "Add Phase 1 Drift web runtime assets"
          git push
