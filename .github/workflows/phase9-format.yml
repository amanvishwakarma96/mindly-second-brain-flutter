name: Phase 9 formatter

on:
  push:
    branches:
      - agent/phase-9-platform-ui

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-9-platform-ui
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test tool
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test tool
          git commit -m "style: apply Dart formatter for Phase 9"
          git push origin HEAD:agent/phase-9-platform-ui
