name: Phase 6 Format

on:
  push:
    branches:
      - agent/phase-6-proactive-insights

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Format Phase 6 Dart sources
        run: dart format lib test tool
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib test tool; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test tool
          git commit -m "Format Phase 6 sources"
          git push
