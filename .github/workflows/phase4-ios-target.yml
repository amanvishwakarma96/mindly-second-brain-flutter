name: Phase 4 iOS Target

on:
  push:
    branches:
      - agent/phase-4-audio-transcription

permissions:
  contents: write

jobs:
  update-ios-target:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-4-audio-transcription
      - name: Set iOS 16 deployment target
        run: |
          sed -i 's/IPHONEOS_DEPLOYMENT_TARGET = 13\.0;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/Runner.xcodeproj/project.pbxproj
          test "$(grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 16.0;' ios/Runner.xcodeproj/project.pbxproj)" -eq 3
          if grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 13.0;' ios/Runner.xcodeproj/project.pbxproj; then
            echo 'iOS 13 deployment target still present'
            exit 1
          fi
      - name: Commit iOS target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner.xcodeproj/project.pbxproj
          git commit -m "Raise iOS deployment target to 16"
          git push origin HEAD:agent/phase-4-audio-transcription
