name: Phase 2 Formatter

on:
  push:
    branches:
      - agent/phase-2-key-management

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Run Phase 2 formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format Dart sources
        run: dart format lib test tool
      - name: Commit formatter output
        run: |
          rm .github/workflows/phase2-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test tool .github/workflows/phase2-format.yml
          git diff --cached --check
          git commit -m "Format Phase 2 Dart sources"
          git push
