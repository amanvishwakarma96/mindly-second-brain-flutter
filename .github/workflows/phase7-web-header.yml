name: Phase 7 Web Header Fix

on:
  push:
    branches:
      - agent/phase-7-tier-3-ai-insights

permissions:
  contents: write

concurrency:
  group: phase7-web-header-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Make Web Insights header responsive
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/screens/web/insights/web_insights_screen.dart')
          text = path.read_text()
          text = text.replace(
              "  Widget build(BuildContext context) {\n    return Scaffold(\n",
              "  Widget build(BuildContext context) {\n    final compactHeader = MediaQuery.sizeOf(context).width < 900;\n    return Scaffold(\n",
              1,
          )
          pattern = re.compile(
              r"      appBar: AppBar\([\s\S]*?      \),\n      body: FutureBuilder<List<ProactiveInsight>>\(",
          )
          replacement = '''      appBar: AppBar(
        title: compactHeader
            ? const Text('Insights')
            : const Row(
                mainAxisSize: MainAxisSize.min,
                children: [
                  MindlyBrandBadge(),
                  SizedBox(width: MindlySpacing.sm),
                  Text('Insights'),
                ],
              ),
        actions: [
          if (compactHeader)
            IconButton(
              tooltip: 'Generate AI insights',
              onPressed: _generatingTier3 ? null : _generateTier3,
              icon: _generatingTier3
                  ? const SizedBox(
                      width: 18,
                      height: 18,
                      child: CircularProgressIndicator(strokeWidth: 2),
                    )
                  : const Icon(Icons.auto_awesome_rounded),
            )
          else
            FilledButton.icon(
              onPressed: _generatingTier3 ? null : _generateTier3,
              icon: _generatingTier3
                  ? const SizedBox(
                      width: 18,
                      height: 18,
                      child: CircularProgressIndicator(strokeWidth: 2),
                    )
                  : const Icon(Icons.auto_awesome_rounded),
              label: const Text('Ask AI'),
            ),
          if (!compactHeader) const SizedBox(width: MindlySpacing.sm),
          if (compactHeader)
            IconButton(
              tooltip: 'Muted insight types',
              onPressed: _showMutedKinds,
              icon: const Icon(Icons.visibility_off_outlined),
            )
          else
            TextButton.icon(
              onPressed: _showMutedKinds,
              icon: const Icon(Icons.visibility_off_outlined),
              label: const Text('Muted types'),
            ),
          const SizedBox(width: MindlySpacing.sm),
        ],
      ),
      body: FutureBuilder<List<ProactiveInsight>>('''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Web Insights AppBar block not found exactly once')
          path.write_text(text)
          PY
      - name: Format Web Insights screen
        run: dart format lib/screens/web/insights/web_insights_screen.dart
      - name: Commit responsive header fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/web/insights/web_insights_screen.dart
          git commit -m "Make Web Insights header responsive"
          git push
