name: Phase 2 Implementation Gate

on:
  push:
    branches:
      - agent/phase-2-key-management

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.event.head_commit.message == 'Run Phase 2 implementation gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Materialize Phase 2 implementation
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, zlib
          payload = ''
          data = json.loads(zlib.decompress(base64.b64decode(payload)))
          for path, content in data.items():
              target = pathlib.Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          PY
      - name: Format Phase 2 Dart sources
        run: dart format lib test tool
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/vector_benchmark.dart
      - name: Commit validated Phase 2 implementation
        run: |
          rm .github/workflows/phase2-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Phase 2 BYOK security controls"
          git push
