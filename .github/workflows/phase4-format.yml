name: Phase 4 Format

on:
  push:
    branches:
      - agent/phase-4-audio-transcription

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-4-audio-transcription
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test tool
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test tool
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Phase 4 audio code"
          git push origin HEAD:agent/phase-4-audio-transcription
