name: Phase 3 Normalize

on:
  push:
    branches:
      - 'agent/phase-3-text-capture-ai-extraction'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fix literal USD labels
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('lib/screens/mobile/capture/mobile_text_capture_screen.dart'),
              Path('lib/screens/desktop/capture/desktop_text_capture_screen.dart'),
              Path('lib/screens/web/capture/web_text_capture_screen.dart'),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace("'Input $/1M tokens'", "'Input \\$/1M tokens'")
              text = text.replace("'Output $/1M tokens'", "'Output \\$/1M tokens'")
              path.write_text(text)
          PY
      - run: dart run build_runner build
      - run: dart format lib test tool
      - name: Commit generated and formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-normalize.yml
          git add lib test tool
          git add -f lib/core/database/mindly_database.g.dart
          if git diff --cached --quiet; then
            echo "No normalization changes to commit."
            exit 0
          fi
          git commit -m "Normalize Phase 3 generated sources"
          git push origin HEAD:agent/phase-3-text-capture-ai-extraction
