name: Phase 5 Format

on:
  push:
    branches:
      - agent/phase-5-memory-browser-search-graph

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-5-memory-browser-search-graph
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: dart format lib test tool
      - name: Commit formatted Dart
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test tool
          git commit -m "Format Phase 5 Dart"
          git push origin HEAD:agent/phase-5-memory-browser-search-graph
