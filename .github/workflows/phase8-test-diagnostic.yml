name: Phase 8 Test Diagnostic

on:
  push:
    branches:
      - agent/phase-8-notifications

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[test-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture expanded Flutter test output
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > phase8-test-diagnostic.txt 2>&1
          status=$?
          echo "EXIT_CODE=$status" >> phase8-test-diagnostic.txt
          exit 0
      - name: Commit diagnostic output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase8-test-diagnostic.txt
          git commit -m "[test-diagnostic] Capture Phase 8 test output"
          git push
